services:

  db:
    image: postgres:15.3-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    ports:
      - "9324:9324"
    volumes:
      - ./app/elasticmq/elasticmq.conf:/opt/elasticmq.conf
  api:
    build:
      context: ./app/api
      dockerfile: Dockerfile
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: db
      SQS_ENDPOINT: http://elasticmq:9324
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      SQS_QUEUE_URL: http://elasticmq:9324/000000000000/orders-queue
    depends_on:
      - db
      - elasticmq
  worker:
    build:
      context: ./app/worker
      dockerfile: Dockerfile
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: db
      SQS_ENDPOINT: http://elasticmq:9324
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      SQS_QUEUE_URL: http://elasticmq:9324/000000000000/orders-queue

    depends_on:
      - db
      - elasticmq
  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    volumes:
      - ./app/frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"

volumes:
  postgres_data: