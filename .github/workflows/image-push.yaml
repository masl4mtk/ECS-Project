name: Image Push

on:
    push:
        branches:
            - main
        paths:
            - "app/**"
    workflow_dispatch:

permissions:
    id-token: write
    contents: read

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: ${{ vars.AWS_ROLE_ARN}}
                aws-region: us-east-1
    