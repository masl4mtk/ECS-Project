name: Image Build and Push

on:
    push:
        branches:
            - main
        paths:
            - "app/**"
            - modules/ECR/**
    workflow_dispatch:

permissions:
    id-token: write
    contents: read

jobs:

    create-repos:
        runs-on: ubuntu-latest
        env:
            TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: ${{ vars.AWS_ROLE_ARN }}
                aws-region: us-east-1

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3

            - name: Terraform init
              run: terraform init

            - name: Create ECR repositories
              run: terraform apply -target=module.ecr -auto-approve

    build-and-push:
        needs: create-repos
        strategy:
            matrix:
                service: [api, frontend, worker]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: ${{ vars.AWS_ROLE_ARN }}
                aws-region: us-east-1
            
            - name: Login to Amazon ECR
              uses: aws-actions/amazon-ecr-login@v2
              id: login-ecr

            - name: Build, tag and push ${{ matrix.service }} image
              env:
                REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                REPOSITORY: orderflow-${{ matrix.service }}-repo
                IMAGE_TAG: ${{ github.sha }}
              run: |
                docker build --platform linux/amd64 -t $REGISTRY/$REPOSITORY:$IMAGE_TAG app/${{ matrix.service }}
                docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG